<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827"><title>Bonus Radar — monitoring ofert</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#f5f5f7;background:#10151f}*{box-sizing:border-box}
    body{margin:0}header,main{max-width:960px;margin:auto;padding:24px}header{padding-top:45px}
    h1{font-size:clamp(2rem,7vw,3.5rem);letter-spacing:-.05em;margin:0 0 8px}p{color:#aeb9cc;line-height:1.5}
    .eyebrow{color:#70d9a1;text-transform:uppercase;font-size:.75rem;font-weight:800;letter-spacing:.16em}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}input,button{font:inherit;border-radius:10px;padding:12px 14px}
    input{flex:1;min-width:220px;background:#1d2735;border:1px solid #3b4859;color:white}
    button{background:#70d9a1;color:#0c1b14;border:0;font-weight:700;cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    article{border:1px solid #344155;border-radius:16px;background:#1a2432;padding:20px;overflow-wrap:anywhere}
    article h2{margin:0 0 6px;font-size:1.15rem}a{color:#91ddff}small{color:#aeb9cc}
    .pill{display:inline-block;color:#70d9a1;background:#17392b;border-radius:99px;padding:5px 9px;margin:4px 4px 4px 0;font-size:.8rem}
    .error{color:#ffb4a8}.excerpt{font-size:.9rem;border-left:2px solid #70d9a1;padding-left:10px;margin:10px 0;color:#c9d3df}
    footer{max-width:960px;margin:20px auto;padding:24px;color:#aeb9cc;font-size:.85rem}
  </style>
</head>
<body>
  <header><div class="eyebrow">Monitoring katalogów</div><h1>Bonus Radar</h1>
    <p>Wyszukuje frazy na stronach z ofertami slotów. Wynik pokazuje obecność tekstu, a nie potwierdzoną, aktywną promocję.</p>
    <div class="toolbar"><input id="filter" type="search" placeholder="Filtruj źródła i frazy" aria-label="Filtruj wyniki"><button id="refresh">Wczytaj najnowszy raport</button></div>
    <p id="status" role="status">Ładowanie wyników…</p></header>
  <main><div id="cards" class="grid"></div></main>
  <footer>Oferty mogą mieć ograniczenia kraju, wieku, depozytu i obrotu. Sprawdź warunki u operatora. 18+</footer>
  <script>
    const cards=document.querySelector('#cards'),status=document.querySelector('#status'),filter=document.querySelector('#filter');let data;
    function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n}
    function render(){cards.replaceChildren();if(!data)return;const q=filter.value.trim().toLocaleLowerCase('pl');let count=0;
      for(const source of data.sources){if(q&&!`${source.name} ${source.url} ${source.matches.map(m=>m.phrase).join(' ')}`.toLocaleLowerCase('pl').includes(q))continue;
        count++;const box=el('article'),title=el('h2','',source.name),link=el('a','','Otwórz źródło ↗');link.href=source.url;link.target='_blank';link.rel='noopener noreferrer';
        box.append(title,link,el('p','',source.status==='ok'?`${source.matches.length} pasujących fraz`:source.status==='pending'?'Oczekuje na pierwszy skan':'Nie udało się sprawdzić strony'));
        if(source.status==='error')box.append(el('small','error',source.error||'Błąd połączenia'));
        for(const match of source.matches){box.append(el('span','pill',match.phrase),el('div','excerpt',match.excerpt))}cards.append(box)}
      if(!count)cards.append(el('p','','Brak wyników dla tego filtra.'));
    }
    async function load(){status.textContent='Pobieranie wyników…';try{const r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);data=await r.json();status.textContent=data.checked_at?`Ostatnie sprawdzenie: ${new Date(data.checked_at).toLocaleString('pl-PL')} · ${data.sources.length} źródła`:'Oczekiwanie na pierwszy skan w GitHub Actions';render()}catch(e){status.textContent='Brak danych. Uruchom monitor.py lub workflow w GitHub Actions.'}}
    filter.addEventListener('input',render);document.querySelector('#refresh').addEventListener('click',load);load();
  </script>
</body></html>
