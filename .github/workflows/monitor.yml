name: Aktualizuj bonusy
on:
  workflow_dispatch:
  push:
    paths:
      - 'monitor.py'
      - 'index.html'
      - 'data.json'
      - '.github/workflows/monitor.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python monitor.py
      - name: Zapisz wyniki
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data.json
          git diff --cached --quiet || (git commit -m 'Aktualizuj wyniki monitoringu' && git push)
